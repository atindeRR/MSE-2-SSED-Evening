name: CD - Build, Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish-deploy:
    name: Build, push to Docker Hub and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # 1. Checkout the source code
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      # 2. Set up the Docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3 + 6. Build the frontend image and tag it v1 and latest
      - name: Build frontend image (v1 and latest)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      # 4 + 6. Build the backend image and tag it v1 and latest
      - name: Build backend image (v1 and latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      # 5. Authenticate with Docker Hub using GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Push all four image tags
      - name: Push images to Docker Hub
        run: |
          docker push "$DOCKERHUB_USERNAME/frontend:v1"
          docker push "$DOCKERHUB_USERNAME/frontend:latest"
          docker push "$DOCKERHUB_USERNAME/backend:v1"
          docker push "$DOCKERHUB_USERNAME/backend:latest"

      # 8. Deploy with docker-compose.deploy.yml (images are pulled from Docker Hub, not built)
      - name: Create runtime environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          {
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Ensure deployment file does not build locally
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "::error::docker-compose.deploy.yml must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Remove local images so the deployment must pull from Docker Hub
        run: |
          docker rmi "$DOCKERHUB_USERNAME/frontend:v1" "$DOCKERHUB_USERNAME/frontend:latest" \
                     "$DOCKERHUB_USERNAME/backend:v1" "$DOCKERHUB_USERNAME/backend:latest"

      - name: Deploy application from Docker Hub images
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 180

      # 9. Verify that the application and required services are running
      - name: Verify deployment
        run: |
          docker compose -f docker-compose.deploy.yml ps
          for svc in postgres redis backend frontend; do
            cid=$(docker compose -f docker-compose.deploy.yml ps -q "$svc")
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid")
            echo "$svc health: $status"
            [ "$status" = "healthy" ] || { docker compose -f docker-compose.deploy.yml logs --no-color "$svc"; exit 1; }
          done
          curl --fail --silent http://localhost:3000/health
          echo
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8080/health
          echo

      - name: Run API tests against the deployed stack
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Frontend: \`$DOCKERHUB_USERNAME/frontend:v1\`, \`$DOCKERHUB_USERNAME/frontend:latest\`"
            echo "- Backend: \`$DOCKERHUB_USERNAME/backend:v1\`, \`$DOCKERHUB_USERNAME/backend:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.deploy.yml logs --no-color || true

      - name: Cleanup deployment
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
          rm -f .env
