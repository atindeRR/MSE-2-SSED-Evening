name: Build, Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, publish and verify images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME" >> "$GITHUB_ENV"
          printf 'POSTGRES_DB=taskflow\nPOSTGRES_USER=taskflow_user\n' >> "$GITHUB_ENV"
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate image-based Compose configuration
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy published images
        run: docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 120

      - name: Verify frontend and backend
        run: |
          curl --fail --silent http://localhost:3000/health
          curl --fail --silent http://localhost:8080/ > /dev/null
          docker compose -f docker-compose.deploy.yml ps

      - name: Run API integration tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Summarize published images
        run: |
          {
            echo "## Published Docker images"
            echo ""
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME }}/backend:v1\` and \`latest\`"
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1\` and \`latest\`"
            echo "- Deployment and API tests passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
