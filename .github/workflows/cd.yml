
name: TaskFlow CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: postgresql://taskflow_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${{ github.run_id }}-${{ github.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            shashi3669/taskflow-frontend:v1
            shashi3669/taskflow-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            shashi3669/taskflow-backend:v1
            shashi3669/taskflow-backend:latest

      - name: Deploy application
        run: |
          docker compose -f docker-compose.deploy.yml up -d --pull always

      - name: Verify deployment
        run: |
          docker compose -f docker-compose.deploy.yml ps
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then
              echo "Application health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Application health check failed"
          docker compose -f docker-compose.deploy.yml logs
          exit 1
