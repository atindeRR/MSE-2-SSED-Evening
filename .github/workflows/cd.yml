name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images and verify deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)
          test -n "$JWT_SECRET" || (echo "Missing JWT_SECRET secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend images
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and push backend images
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Validate image-based deployment Compose
        run: |
          docker compose -f docker-compose.deploy.yml config --quiet
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy published images on the GitHub-hosted runner
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify service health and connectivity
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health > /tmp/backend-health.json; then
              echo "Backend health endpoint is responding"
              cat /tmp/backend-health.json
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done

          for service in postgres redis backend; do
            container_id=$(docker compose -f docker-compose.deploy.yml ps -q "$service")
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            test "$health" = "healthy" || {
              echo "$service health status: $health"
              exit 1
            }
            echo "$service health status: healthy"
          done

          frontend_id=$(docker compose -f docker-compose.deploy.yml ps -q frontend)
          frontend_status=$(docker inspect --format '{{.State.Status}}' "$frontend_id")
          test "$frontend_status" = "running"
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8080/health
          echo
          echo "Frontend is running and proxies successfully to the backend"

      - name: Record image and runner deployment details
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest\`"
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME }}/backend:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "Deployment was verified on this temporary GitHub-hosted runner."
            echo "It is not a persistent deployment to the developer's personal computer."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up runner containers without removing volumes
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
