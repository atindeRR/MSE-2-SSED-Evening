
name: Docker Practical - Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, publish and verify TaskFlow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$USERNAME" || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          test -n "$TOKEN" || (echo "Missing DOCKERHUB_TOKEN" && exit 1)
          test -n "$DB_PASSWORD" || (echo "Missing POSTGRES_PASSWORD" && exit 1)

          if [ "$USERNAME" != "pie250" ]; then
            echo "DOCKERHUB_USERNAME must be pie250 for this deployment file"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            pie250/backend:v1
            pie250/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            pie250/frontend:v1
            pie250/frontend:latest

      - name: Create deployment environment
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
          } > .env

      - name: Validate deployment Compose
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull Docker Hub images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy application
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify application health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "Application health check passed"
              exit 0
            fi
            sleep 3
          done

          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --no-color
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test

      - name: Deployment summary
        run: |
          {
            echo "## TaskFlow deployment successful"
            echo ""
            echo "- Frontend: pie250/frontend:v1 and latest"
            echo "- Backend: pie250/backend:v1 and latest"
            echo "- Health check: Passed"
            echo "- API tests: Passed"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup containers
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
