name: CD - Build, Publish and Verify

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build, tag and push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "Missing POSTGRES_PASSWORD secret"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/frontend:v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/backend:v1
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag images with latest
        run: |
          docker tag "${DOCKERHUB_USERNAME}/frontend:v1" "${DOCKERHUB_USERNAME}/frontend:latest"
          docker tag "${DOCKERHUB_USERNAME}/backend:v1" "${DOCKERHUB_USERNAME}/backend:latest"

      - name: Push all image tags
        run: |
          docker push "${DOCKERHUB_USERNAME}/frontend:v1"
          docker push "${DOCKERHUB_USERNAME}/frontend:latest"
          docker push "${DOCKERHUB_USERNAME}/backend:v1"
          docker push "${DOCKERHUB_USERNAME}/backend:latest"

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  deploy-and-verify:
    name: Deploy from Docker Hub images and verify
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::${JWT_SECRET}"
          {
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}"
          } > .env

      - name: Validate deployment compose uses published images
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "docker-compose.deploy.yml must not use build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using docker-compose.deploy.yml
        run: docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 180

      - name: Verify services and application
        run: |
          docker compose -f docker-compose.deploy.yml ps
          for svc in postgres redis backend frontend; do
            cid="$(docker compose -f docker-compose.deploy.yml ps -q "$svc")"
            status="$(docker inspect --format '{{.State.Status}} / {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$cid")"
            echo "$svc: $status"
          done
          curl --fail --silent --show-error http://localhost:3000/health | tee /tmp/health.json
          echo
          grep -q '"postgres":"ok"' /tmp/health.json
          grep -q '"redis":"ok"' /tmp/health.json
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          curl --fail --silent --show-error http://localhost:8080/health

      - name: Run API tests against deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.deploy.yml logs --no-color

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans

      - name: Summary
        if: success()
        run: |
          {
            echo "## Docker Hub images"
            echo "- \`${DOCKERHUB_USERNAME}/frontend\` : \`v1\`, \`latest\`"
            echo "- \`${DOCKERHUB_USERNAME}/backend\` : \`v1\`, \`latest\`"
            echo ""
            echo "Deployment ran on a temporary GitHub-hosted runner for CI verification only. It is not a persistent production server."
          } >> "$GITHUB_STEP_SUMMARY"