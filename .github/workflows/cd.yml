name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Create deployment environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env

      - name: Validate deployment Compose
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy application
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify services
        run: |
          docker compose -f docker-compose.deploy.yml ps
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health; then
              echo "Application and backend health verified"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml logs
          exit 1

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true