
name: Docker Practical - Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment file
        run: |
          echo "POSTGRES_DB=taskflow" >> .env
          echo "POSTGRES_USER=taskflow_user" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.POSTGRES_PASSWORD }}" >> .env

      - name: Validate deployment Compose
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull Docker Hub images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 40); do
            if [ "$(docker compose -f docker-compose.deploy.yml ps --format json | grep -c 'healthy')" -ge 3 ]; then
              break
            fi
            sleep 3
          done

          docker compose -f docker-compose.deploy.yml ps

          curl --fail http://localhost:8081/

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down
