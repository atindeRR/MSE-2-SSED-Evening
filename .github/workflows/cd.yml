name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, Publish and Deploy TaskFlow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout student's repository
        uses: actions/checkout@v4

      - name: 2. Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)
          echo "All required secrets are configured."

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Build and push backend image (v1 and latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ github.sha }}

      - name: 6. Build and push frontend image (v1 and latest)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ github.sha }}

      - name: 7. Create deployment environment file
        env:
          DB_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${DB_PASS}
          DATABASE_URL=postgresql://taskflow_user:${DB_PASS}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=cd_production_jwt_secret_token
          PORT=3000
          DOCKERHUB_USERNAME=${DH_USER}
          EOF

      - name: 8. Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: 9. Pull published images and Deploy
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      - name: 10. Verify application and services health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Backend is healthy and accepting traffic"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null
          echo "Frontend is serving HTTP traffic on 8080"

      - name: 11. Run API verification test suite
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: 12. Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
