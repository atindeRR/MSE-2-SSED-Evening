
name: TaskFlow CD - Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-deploy:
    name: Build, Push and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD"
          printf 'POSTGRES_DB=taskflow\nPOSTGRES_USER=taskflow_user\nPOSTGRES_PASSWORD=%s\nDATABASE_URL=postgresql://taskflow_user:%s@postgres:5432/taskflow\nREDIS_URL=redis://redis:6379\nJWT_SECRET=%s\nPORT=3000\n' "$DB_PASSWORD" "$DB_PASSWORD" "$DB_PASSWORD" > .env

      - name: Validate deployment Compose
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment file must use published images"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy containers
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8081/health; then
              echo
              echo "Deployment health check passed"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --no-color
          exit 1

      - name: Save deployment summary
        run: |
          {
            echo "## TaskFlow Docker Deployment"
            echo ""
            echo "- Backend: akhilheat123/backend:latest"
            echo "- Frontend: akhilheat123/frontend:latest"
            echo "- Commit: $GITHUB_SHA"
            echo "- Health check: Passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
