name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish student's images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow_user
      PORT: "3000"
      REDIS_URL: redis://redis:6379
    steps:
      - name: Checkout student's repository
        uses: actions/checkout@v4

      - name: Validate required Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: >-
          docker buildx build --load
          --tag "$DOCKERHUB_USERNAME/backend:latest"
          --tag "$DOCKERHUB_USERNAME/backend:v1"
          ./backend

      - name: Build frontend image
        run: >-
          docker buildx build --load
          --tag "$DOCKERHUB_USERNAME/frontend:latest"
          --tag "$DOCKERHUB_USERNAME/frontend:v1"
          ./frontend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push required image tags
        run: |
          docker push "$DOCKERHUB_USERNAME/backend:latest"
          docker push "$DOCKERHUB_USERNAME/backend:v1"
          docker push "$DOCKERHUB_USERNAME/frontend:latest"
          docker push "$DOCKERHUB_USERNAME/frontend:v1"

      - name: Generate temporary deployment JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Deployment backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          docker compose -f docker-compose.deploy.yml ps

      - name: Set up Node.js for API tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run API tests against Docker Hub deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Show deployment logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.deploy.yml ps || true
          docker compose -f docker-compose.deploy.yml logs --no-color || true

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME }}/backend:latest\`"
            echo "- Backend (v1): \`${{ secrets.DOCKERHUB_USERNAME }}/backend:v1\`"
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest\`"
            echo "- Frontend (v1): \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
