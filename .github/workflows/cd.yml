name: CD - Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3 + 4. Build images (tagged v1 and latest in same step)
      - name: Build frontend image
        run: docker build -t $DOCKERHUB_USERNAME/frontend:v1 ./frontend

      - name: Build backend image
        run: docker build -t $DOCKERHUB_USERNAME/backend:v1 ./backend

      # 5. Login with secrets (never hardcode)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Tag latest
      - name: Tag images with latest
        run: |
          docker tag $DOCKERHUB_USERNAME/frontend:v1 $DOCKERHUB_USERNAME/frontend:latest
          docker tag $DOCKERHUB_USERNAME/backend:v1  $DOCKERHUB_USERNAME/backend:latest

      # 7. Push all 4 tags
      - name: Push images to Docker Hub
        run: |
          docker push $DOCKERHUB_USERNAME/frontend:v1
          docker push $DOCKERHUB_USERNAME/frontend:latest
          docker push $DOCKERHUB_USERNAME/backend:v1
          docker push $DOCKERHUB_USERNAME/backend:latest

      # 8. Deploy from Docker Hub images
      - name: Deploy with docker-compose.deploy.yml
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      # 9. Verify
      - name: Verify services
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000/health && break
            [ "$i" = 30 ] && { docker compose -f docker-compose.deploy.yml logs; exit 1; }
            sleep 3
          done
          echo
          curl -fs http://localhost:8080/ > /dev/null && echo "Frontend OK"
          curl -fs http://localhost:8080/api/../health && echo " <- frontend->backend proxy OK"
          docker compose -f docker-compose.deploy.yml ps

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v
