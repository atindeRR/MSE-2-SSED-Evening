name: Docker Practical - CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: 5. Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: 6. Deploy using Docker Hub images
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} docker compose -f docker-compose.deploy.yml up -d

      - name: 7. Wait until services are healthy and verify
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8888/ > /dev/null && curl --fail --silent http://localhost:3000/health > /dev/null; then
              echo "Services are healthy and responding"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Timeout waiting for services to become healthy"
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            echo "Waiting for services ($attempt/40)..."
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml ps
          curl -f http://localhost:8888/

      - name: Run API verification tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
