name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, Publish and Verify Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Stage 1: Checkout the source code
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: Validate required GitHub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      # Stage 2: Set up Docker build environment
      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Stage 5: Authenticate with Docker Hub using GitHub Secrets
      - name: 5. Authenticate with Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Stages 4, 6, 7: Build, tag (v1 & latest), and push backend image
      - name: 4, 6, 7. Build, tag and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

      # Stages 3, 6, 7: Build, tag (v1 & latest), and push frontend image
      - name: 3, 6, 7. Build, tag and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}

      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgresql://taskflow_user:${POSTGRES_PASSWORD}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=replace_with_a_long_random_secret
          PORT=3000
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          EOF

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      # Stage 8: Deploy application using docker-compose.deploy.yml
      - name: 8. Deploy application using docker-compose.deploy.yml
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      # Stage 9: Verify that application and required services are running successfully
      - name: 9. Verify deployment health and accessibility
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Deployment backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null
          echo "Frontend is accessible on port 8080"

      - name: Run API test suite against deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        if: always()
        run: |
          {
            echo "## Docker Hub Publication & Deployment Summary"
            echo ""
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME }}/backend:latest\` (and \`v1\`)"
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest\` (and \`v1\`)"
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Deployment: Successfully verified via \`docker-compose.deploy.yml\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
