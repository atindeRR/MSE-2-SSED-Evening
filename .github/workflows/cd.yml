
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and deploy Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || exit 1
          test -n "$DOCKERHUB_TOKEN" || exit 1
          test -n "$POSTGRES_PASSWORD" || exit 1
          test -n "$JWT_SECRET" || exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Verify Docker Hub images
        run: |
          docker manifest inspect "$DOCKERHUB_USERNAME/taskflow-backend:v1"
          docker manifest inspect "$DOCKERHUB_USERNAME/taskflow-backend:latest"
          docker manifest inspect "$DOCKERHUB_USERNAME/taskflow-frontend:v1"
          docker manifest inspect "$DOCKERHUB_USERNAME/taskflow-frontend:latest"

      - name: Validate deployment Compose
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images only"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy published images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify container health
        run: |
          for service in postgres redis backend; do
            container_id=$(docker compose -f docker-compose.deploy.yml ps -q "$service")

            for attempt in $(seq 1 40); do
              health=$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)

              if [ "$health" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi

              if [ "$attempt" -eq 40 ]; then
                echo "$service failed health check"
                docker compose -f docker-compose.deploy.yml logs
                exit 1
              fi

              sleep 3
            done
          done

      - name: Verify frontend and backend endpoints
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:3001/health
          curl --fail --retry 10 --retry-delay 3 http://localhost:8081/
          curl --fail --retry 10 --retry-delay 3 http://localhost:8081/health

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3001
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Generate workflow summary
        if: always()
        run: |
          {
            echo "## Docker Hub Publication and Deployment"
            echo ""
            echo "- Backend: $DOCKERHUB_USERNAME/taskflow-backend:latest"
            echo "- Frontend: $DOCKERHUB_USERNAME/taskflow-frontend:latest"
            echo "- Commit: $GITHUB_SHA"
            echo "- Result: ${{ job.status }}"
            echo ""
            echo "Deployment was tested on a temporary GitHub-hosted runner."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml down --remove-orphans || true
