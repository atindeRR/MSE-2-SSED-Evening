
name: TaskFlow Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push frontend with both tags
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      # 5. Build and push backend with both tags
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      # 6. Create runtime environment for deployment
      - name: Configure deployment environment
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "POSTGRES_DB=taskflow" >> .env
          echo "POSTGRES_USER=taskflow_user" >> .env
          echo "POSTGRES_PASSWORD=${DB_PASSWORD}" >> .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env

      # 7. Deploy using published Docker Hub images
      - name: Deploy application
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      # 8. Verify deployment and health checks
      - name: Verify application deployment
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then
              echo "Backend health check successful"
              break
            fi
            echo "Waiting for backend..."
            sleep 5
          done

          curl -fsS http://localhost:3000/health

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Frontend health check successful"
              break
            fi
            echo "Waiting for frontend..."
            sleep 5
          done

          curl -fI http://localhost:8080/

          docker compose -f docker-compose.deploy.yml ps

          for service in frontend backend postgres redis; do
            status=$(docker compose -f docker-compose.deploy.yml ps --format json "$service" | grep -o '"Health":"healthy"' || true)
            if [ -z "$status" ]; then
              echo "Service $service is not healthy"
              exit 1
            fi
            echo "$service is healthy"
          done

      # 9. Show deployment logs if the job fails
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.deploy.yml logs
