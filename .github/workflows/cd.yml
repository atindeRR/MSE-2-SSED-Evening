name: Docker Practical - Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$USERNAME" || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          test -n "$TOKEN" || (echo "Missing DOCKERHUB_TOKEN" && exit 1)
          test -n "$DB_PASSWORD" || (echo "Missing POSTGRES_PASSWORD" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Create deployment environment
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          cat > .env <<EOF
          DOCKERHUB_USERNAME=$USERNAME
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=$DB_PASSWORD
          JWT_SECRET=${{ secrets.POSTGRES_PASSWORD }}
          REDIS_URL=redis://redis:6379
          PORT=3000
          EOF

      - name: Validate deployment configuration
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy published images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify services
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo "Backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:18081/ > /dev/null
          echo "Frontend is responding"

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record image references
        run: |
          {
            echo "## Docker Hub publication"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:v1"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:v1"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
