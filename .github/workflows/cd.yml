
name: TaskFlow CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            harshit289/backend:v1
            harshit289/backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            harshit289/frontend:v1
            harshit289/frontend:latest

      - name: Create environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' \
            "$POSTGRES_PASSWORD" "$JWT_SECRET" > .env

      - name: Validate deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull Docker Hub images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy containers
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health; then
              echo "Deployment is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null

      - name: Show deployment status
        if: always()
        run: docker compose -f docker-compose.deploy.yml ps

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
