
name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Create deployment environment
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "POSTGRES_DB=taskflow" >> .env
          echo "POSTGRES_USER=taskflow_user" >> .env
          echo "POSTGRES_PASSWORD=${DB_PASSWORD}" >> .env
          echo "DATABASE_URL=postgresql://taskflow_user:${DB_PASSWORD}@postgres:5432/taskflow" >> .env
          echo "REDIS_URL=redis://redis:6379" >> .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "PORT=3000" >> .env

      - name: Deploy using Docker Hub images
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --no-build

      - name: Verify container health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo "Application healthy!"
              exit 0
            fi
            sleep 5
          done

          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --tail=100
          exit 1

      - name: Show deployment status
        run: docker compose -f docker-compose.deploy.yml ps

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down
