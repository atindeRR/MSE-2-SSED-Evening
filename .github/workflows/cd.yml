name: CI/CD - Build, Publish and Deploy TaskFlow

# Executes automatically on push to main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_VERSION: v1

jobs:
  build-publish-deploy:
    name: Build, push to Docker Hub and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Stage 1: Checkout the source code
      - name: 1. Checkout the source code
        uses: actions/checkout@v4

      - name: Validate required secrets are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret: $name"; missing=1; fi
          done
          exit $missing

      # Stage 2: Set up the Docker build environment
      - name: 2. Set up the Docker build environment
        uses: docker/setup-buildx-action@v3

      # Stage 3: Build the frontend Docker image
      - name: 3. Build the frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: taskflow-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Stage 4: Build the backend Docker image
      - name: 4. Build the backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: taskflow-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Stage 5: Authenticate with Docker Hub using GitHub Secrets
      - name: 5. Authenticate with Docker Hub using GitHub Secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Stage 6: Tag both images with v1 and latest
      - name: 6. Tag both images with v1 and latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for app in frontend backend; do
            docker tag "taskflow-$app:ci" "$DOCKERHUB_USERNAME/$app:$IMAGE_VERSION"
            docker tag "taskflow-$app:ci" "$DOCKERHUB_USERNAME/$app:latest"
          done
          docker image ls --filter "reference=$DOCKERHUB_USERNAME/*"

      # Stage 7: Push all image tags to Docker Hub
      - name: 7. Push all image tags to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for app in frontend backend; do
            for tag in "$IMAGE_VERSION" latest; do
              docker push "$DOCKERHUB_USERNAME/$app:$tag"
            done
          done

      - name: Remove local images before deployment
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker image rm taskflow-frontend:ci taskflow-backend:ci \
            "$DOCKERHUB_USERNAME/frontend:$IMAGE_VERSION" "$DOCKERHUB_USERNAME/frontend:latest" \
            "$DOCKERHUB_USERNAME/backend:$IMAGE_VERSION" "$DOCKERHUB_USERNAME/backend:latest"

      # Stage 8: Deploy the application using docker-compose.deploy.yml
      - name: 8. Deploy the application using docker-compose.deploy.yml
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "::error::docker-compose.deploy.yml must use published images, not build:"
            exit 1
          fi
          umask 077
          {
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PORT=3000"
          } > .env
          docker compose -f docker-compose.deploy.yml config --quiet
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 180

      # Stage 9: Verify that the application and required services are running successfully
      - name: 9. Verify that the application and required services are running successfully
        run: |
          set -e
          docker compose -f docker-compose.deploy.yml ps
          echo "=== Health check status of each service ==="
          for svc in postgres redis backend frontend; do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.deploy.yml ps -q "$svc")")
            echo "$svc: $status"
            [ "$status" = "healthy" ]
          done
          echo "=== Backend API Health (PostgreSQL & Redis) ==="
          curl --fail --silent --show-error http://localhost:3000/health; echo
          echo "=== Frontend Web Server HTTP response ==="
          curl --fail --silent --show-error -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8080/
          echo "=== Frontend Reverse Proxy to Backend ==="
          curl --fail --silent --show-error http://localhost:8080/health; echo
          echo "=== Custom Network DNS Resolution ==="
          docker compose -f docker-compose.deploy.yml exec -T backend getent hosts postgres
          docker compose -f docker-compose.deploy.yml exec -T backend getent hosts redis
          docker network inspect taskflow-network --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{println}}{{end}}'

      - name: Run API tests against deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Publish deployment summary
        if: success()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "## TaskFlow Images Published & Deployed Successfully"
            echo ""
            echo "| Service | Published Image Tags |"
            echo "|---|---|"
            echo "| Frontend | \`$DOCKERHUB_USERNAME/frontend:$IMAGE_VERSION\`, \`$DOCKERHUB_USERNAME/frontend:latest\` |"
            echo "| Backend | \`$DOCKERHUB_USERNAME/backend:$IMAGE_VERSION\`, \`$DOCKERHUB_USERNAME/backend:latest\` |"
            echo ""
            echo "- **Commit**: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.deploy.yml logs --no-color || true

      - name: Clean up deployment
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
          rm -f .env
