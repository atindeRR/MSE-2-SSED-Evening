name: Build, publish and verify Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$POSTGRES_PASSWORD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish frontend v1 and latest
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and publish backend v1 and latest
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Prepare temporary deployment secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate image-based Compose configuration
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo 'Deployment must use published images only'
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy from Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d --no-build

      - name: Verify frontend, backend and service health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health | grep -q '"status":"ok"'; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null
          docker compose -f docker-compose.deploy.yml ps
          docker network inspect taskflow_net --format '{{len .Containers}} containers on taskflow_net'

      - name: Test API through deployed frontend
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Verify PostgreSQL persistence and Redis restart
        run: |
          set -euo pipefail
          compose='docker compose -f docker-compose.deploy.yml'
          $compose exec -T postgres psql -U taskflow_user -d taskflow -c 'CREATE TABLE IF NOT EXISTS deployment_check (marker TEXT PRIMARY KEY);'
          $compose exec -T postgres psql -U taskflow_user -d taskflow -c "INSERT INTO deployment_check VALUES ('persisted') ON CONFLICT DO NOTHING;"
          $compose stop postgres
          $compose rm -f postgres
          $compose up -d --wait postgres
          $compose exec -T postgres psql -U taskflow_user -d taskflow -tAc "SELECT marker FROM deployment_check WHERE marker = 'persisted'" | grep -qx persisted
          $compose restart redis
          $compose up -d --wait
          curl --fail --silent http://localhost:8080/health | grep -q '"status":"ok"'

      - name: Summarize published images
        run: |
          {
            echo "## Published and verified"
            echo "- ${DOCKERHUB_USERNAME}/frontend:v1 and :latest"
            echo "- ${DOCKERHUB_USERNAME}/backend:v1 and :latest"
            echo "- Deployment: docker-compose.deploy.yml"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture container evidence
        if: always()
        run: |
          mkdir -p evidence
          docker compose -f docker-compose.deploy.yml ps > evidence/containers.txt || true
          docker network inspect taskflow_net > evidence/network.json || true
          docker compose -f docker-compose.deploy.yml logs --no-color > evidence/logs.txt || true

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: evidence/
          if-no-files-found: ignore

      - name: Remove temporary deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
