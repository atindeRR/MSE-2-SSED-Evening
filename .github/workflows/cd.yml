name: CD - Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build frontend image
        run: docker build -t frontend:ci ./frontend

      - name: 4. Build backend image
        run: docker build -t backend:ci ./backend

      - name: 5. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 6. Tag images with v1 and latest
        run: |
          for svc in frontend backend; do
            docker tag $svc:ci $DOCKERHUB_USERNAME/$svc:v1
            docker tag $svc:ci $DOCKERHUB_USERNAME/$svc:latest
          done

      - name: 7. Push all tags to Docker Hub
        run: |
          for svc in frontend backend; do
            docker push $DOCKERHUB_USERNAME/$svc:v1
            docker push $DOCKERHUB_USERNAME/$svc:latest
          done

      - name: 8. Deploy with docker-compose.deploy.yml
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          {
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env
          # remove local tags so compose really pulls from Docker Hub
          docker image rm $DOCKERHUB_USERNAME/frontend:latest $DOCKERHUB_USERNAME/backend:latest
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --wait

      - name: 9. Verify application and services
        run: |
          docker compose -f docker-compose.deploy.yml ps
          curl --fail --silent http://localhost:3000/health && echo
          curl --fail --silent http://localhost:8080/ > /dev/null && echo "Frontend OK"
          curl --fail --silent http://localhost:8080/health && echo " <- frontend -> backend proxy OK"
          docker compose -f docker-compose.deploy.yml exec -T postgres pg_isready
          docker compose -f docker-compose.deploy.yml exec -T redis redis-cli ping

      - name: Run API tests against deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: npm ci && npm test

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.deploy.yml logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
