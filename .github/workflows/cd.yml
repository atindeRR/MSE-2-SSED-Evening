
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1

      - name: Validate deployment compose
        run: docker compose -f docker-compose.deploy.yml config

      - name: Pull images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify backend health
        run: |
          for i in $(seq 1 40); do
            if curl --fail http://localhost:3000/health; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs
          exit 1

      - name: Verify frontend
        run: curl --fail http://localhost:8080/

      - name: Cleanup containers
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans
