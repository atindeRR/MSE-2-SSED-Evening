name: Docker Practical - Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Build, publish and deploy images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build frontend Docker image
      - name: Build frontend Docker image
        run: docker build -t frontend:build ./frontend

      # 4. Build backend Docker image
      - name: Build backend Docker image
        run: docker build -t backend:build ./backend

      # 5. Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6 & 7. Tag and push frontend image (v1 + latest)
      - name: Tag and push frontend image
        run: |
          docker tag frontend:build ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
          docker tag frontend:build ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      # 6 & 7. Tag and push backend image (v1 + latest)
      - name: Tag and push backend image
        run: |
          docker tag backend:build ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
          docker tag backend:build ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      # 8. Create deployment environment file
      - name: Create deployment environment file
        run: |
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql://taskflow_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=${{ secrets.DOCKERHUB_TOKEN }}
          PORT=3000
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      # 8. Deploy using docker-compose.deploy.yml
      - name: Deploy application using published images
        run: docker compose -f docker-compose.deploy.yml up -d

      # 9. Verify backend is healthy
      - name: Verify backend health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/health; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/40 — waiting for backend..."
            sleep 3
          done
          echo "Backend did not become healthy in time"
          docker compose -f docker-compose.deploy.yml logs backend
          exit 1

      # 9. Verify frontend is responding
      - name: Verify frontend is responding
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/; then
              echo "Frontend is responding"
              exit 0
            fi
            echo "Attempt $i/20 — waiting for frontend..."
            sleep 3
          done
          echo "Frontend did not respond in time"
          docker compose -f docker-compose.deploy.yml logs frontend
          exit 1

      # 9. Verify all services are running
      - name: Show running services
        run: docker compose -f docker-compose.deploy.yml ps

      # Cleanup
      - name: Cleanup containers
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
