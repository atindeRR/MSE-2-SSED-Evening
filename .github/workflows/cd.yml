name: Docker CD - Build, Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  publish-and-deploy:
    name: Build images, push to Docker Hub and verify deployment
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Missing DOCKERHUB_TOKEN secret"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "::error::Missing POSTGRES_PASSWORD secret"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgresql://taskflow_user:${POSTGRES_PASSWORD}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=${JWT_SECRET}
          PORT=3000
          EOF

      - name: Validate image-based deployment configuration
        run: |
          grep -q "image: .*/frontend:latest" docker-compose.deploy.yml
          grep -q "image: .*/backend:latest" docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "::error::docker-compose.deploy.yml must not build application images"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Deploy published images
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      - name: Verify services are running
        run: |
          for attempt in $(seq 1 60); do
            running="$(docker compose -f docker-compose.deploy.yml ps --status running --quiet | wc -l)"
            if [ "$running" -eq 4 ]; then
              echo "All 4 services are running"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done

      - name: Verify backend health through the frontend proxy
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "Frontend proxy -> backend health OK"
              exit 0
            fi
            echo "Waiting for deployment ($attempt/40)..."
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --no-color
          exit 1

      - name: Verify frontend is served
        run: curl --fail --silent --show-error http://localhost:8080/ > /dev/null && echo "Frontend is responding"

      - name: Run API tests against the deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "| Image | Tags |"
            echo "|---|---|"
            echo "| \`${{ secrets.DOCKERHUB_USERNAME }}/frontend\` | \`v1\`, \`latest\` |"
            echo "| \`${{ secrets.DOCKERHUB_USERNAME }}/backend\` | \`v1\`, \`latest\` |"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployment: \`docker compose -f docker-compose.deploy.yml up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
          docker compose -f docker-compose.deploy.yml ps >> "$GITHUB_STEP_SUMMARY" || true

      - name: Clean up deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
