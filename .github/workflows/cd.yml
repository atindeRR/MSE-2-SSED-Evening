name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, publish to Docker Hub, deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "Missing POSTGRES_PASSWORD secret"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (v1 and latest)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build backend image (v1 and latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push all image tags to Docker Hub
        run: |
          for repo in frontend backend; do
            for tag in v1 latest; do
              docker push "${DOCKERHUB_USERNAME}/${repo}:${tag}"
            done
          done

      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Fall back to an ephemeral random JWT secret if the repository secret is not set
          if [ -z "$JWT_SECRET" ]; then JWT_SECRET="$(openssl rand -hex 32)"; fi
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}"
          } > .env

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "docker-compose.deploy.yml must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Remove local images so deployment uses Docker Hub
        run: |
          docker rmi "${DOCKERHUB_USERNAME}/frontend:v1" "${DOCKERHUB_USERNAME}/frontend:latest" \
                     "${DOCKERHUB_USERNAME}/backend:v1" "${DOCKERHUB_USERNAME}/backend:latest"

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull frontend backend

      - name: Deploy using docker-compose.deploy.yml
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment and service health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8080/health
          echo
          docker compose -f docker-compose.deploy.yml ps

      - name: Run API tests against Docker Hub deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Verify PostgreSQL persistence and Redis restart
        run: bash scripts/verify-persistence.sh docker-compose.deploy.yml

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- \`${DOCKERHUB_USERNAME}/frontend:v1\`, \`${DOCKERHUB_USERNAME}/frontend:latest\`"
            echo "- \`${DOCKERHUB_USERNAME}/backend:v1\`, \`${DOCKERHUB_USERNAME}/backend:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.deploy.yml logs --no-color --tail 100 || true

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
