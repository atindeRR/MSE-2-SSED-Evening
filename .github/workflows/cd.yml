name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, Publish and Deploy Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout student repository
        uses: actions/checkout@v4

      - name: Validate required GitHub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Error: Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Error: Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Error: Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ github.sha }}

      - name: Create deployment environment file
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${DB_PASSWORD}
          DATABASE_URL=postgresql://taskflow_user:${DB_PASSWORD}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=production_ci_cd_deployment_secret_token
          PORT=3000
          DOCKERHUB_USERNAME=${DH_USER}
          EOF

      - name: Validate image-based deployment Compose configuration
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Error: docker-compose.deploy.yml must use published images, not build: directives"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy application stack using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify application containers and health status
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Deployment backend is healthy and responding"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Backend did not become healthy within timeout"
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            echo "Waiting for backend health check ($attempt/40)..."
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null
          echo "Frontend reverse proxy is responding successfully"

      - name: Execute automated smoke tests against deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record publication summary
        if: always()
        run: |
          {
            echo "## Docker Hub Publication & CI/CD Summary"
            echo ""
            echo "- Backend Images: \`${{ secrets.DOCKERHUB_USERNAME }}/backend:v1\`, \`${{ secrets.DOCKERHUB_USERNAME }}/backend:latest\`"
            echo "- Frontend Images: \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1\`, \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest\`"
            echo "- Deployment Status: Verified via \`docker-compose.deploy.yml\`"
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment resources
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
