name: Docker Practical - Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            shreyamaurya24/backend:v1
            shreyamaurya24/backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            shreyamaurya24/frontend:v1
            shreyamaurya24/frontend:latest

      - name: Create Environment File
        run: |
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.POSTGRES_PASSWORD }}
          PORT=3000
          EOF

      - name: Validate Deployment Configuration
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull Docker Hub Images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy Application
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify Containers
        run: |
          docker compose -f docker-compose.deploy.yml ps

      - name: Verify Backend Health
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/health; then
              echo "Backend health check successful"
              exit 0
            fi
            sleep 3
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.deploy.yml logs
          exit 1

      - name: Verify Frontend
        run: curl -f http://localhost:8080/

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v