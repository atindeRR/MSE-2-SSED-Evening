
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Push and Verify Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            sudhanshugill/backend:v1
            sudhanshugill/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            sudhanshugill/frontend:v1
            sudhanshugill/frontend:latest

      - name: Create deployment environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$JWT_SECRET"
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' \
            "$POSTGRES_PASSWORD" "$JWT_SECRET" > .env

      - name: Validate deployment Compose
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify backend and frontend
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3001/health; then
              echo
              echo "Backend is healthy"
              break
            fi

            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi

            sleep 3
          done

          curl --fail --silent http://localhost:8082/ > /dev/null
          echo "Frontend is accessible"

          docker compose -f docker-compose.deploy.yml ps

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3001
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Deployment summary
        run: |
          {
            echo "## Docker Hub Publication"
            echo "- Backend: sudhanshugill/backend:v1 and latest"
            echo "- Frontend: sudhanshugill/frontend:v1 and latest"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.deploy.yml logs --no-color

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
