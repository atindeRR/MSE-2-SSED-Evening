name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker build -t $DH_USER/frontend:v1 ./frontend

      - name: Build backend image
        run: docker build -t $DH_USER/backend:v1 ./backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag images as latest
        run: |
          docker tag $DH_USER/frontend:v1 $DH_USER/frontend:latest
          docker tag $DH_USER/backend:v1 $DH_USER/backend:latest

      - name: Push images
        run: |
          docker push $DH_USER/frontend:v1
          docker push $DH_USER/frontend:latest
          docker push $DH_USER/backend:v1
          docker push $DH_USER/backend:latest

      - name: Create env file
        run: |
          echo "POSTGRES_DB=taskflow" >> .env
          echo "POSTGRES_USER=taskflow_user" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "DOCKERHUB_USERNAME=$DH_USER" >> .env

      - name: Deploy with docker-compose.deploy.yml
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for i in $(seq 1 40); do
            curl -fs http://localhost:3000/health && break
            [ $i -eq 40 ] && docker compose -f docker-compose.deploy.yml logs && exit 1
            sleep 3
          done
          curl -fs http://localhost:8080/ > /dev/null
          docker compose -f docker-compose.deploy.yml ps

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v