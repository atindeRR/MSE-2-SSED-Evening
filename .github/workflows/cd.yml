
name: Docker Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$POSTGRES_PASSWORD"
          test -n "$JWT_SECRET"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            adityeah19/frontend:v1
            adityeah19/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            adityeah19/backend:v1
            adityeah19/backend:latest

      - name: Create deployment environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          umask 077
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          EOF

      - name: Validate deployment configuration
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull Docker images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy containers
        run: docker compose -f docker-compose.deploy.yml up -d --wait

      - name: Verify deployment
        run: |
          curl --fail http://localhost:3000/health
          curl --fail http://localhost:8080/health
          docker compose -f docker-compose.deploy.yml ps

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
