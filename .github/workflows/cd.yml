name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: postgresql://taskflow_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${{ secrets.POSTGRES_PASSWORD }}
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$POSTGRES_PASSWORD"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Validate deployment Compose
        run: |
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify services and application
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo "Backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done

          curl --fail --silent http://localhost:8080/ > /dev/null
          docker compose -f docker-compose.deploy.yml ps

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
