
name: Docker Build, Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publish-deploy:
    name: Build, Push and Deploy TaskFlow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GitHub Secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing Docker Hub username" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing Docker Hub token" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing PostgreSQL password" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import secrets
          from urllib.parse import quote

          password = os.environ["POSTGRES_PASSWORD"]
          encoded_password = quote(password, safe="")
          jwt_secret = secrets.token_hex(32)

          with open(".env", "w") as f:
              f.write("POSTGRES_DB=taskflow\n")
              f.write("POSTGRES_USER=taskflow_user\n")
              f.write(f"POSTGRES_PASSWORD={password}\n")
              f.write(
                  "DATABASE_URL=postgresql://taskflow_user:"
                  f"{encoded_password}@postgres:5432/taskflow\n"
              )
              f.write("REDIS_URL=redis://redis:6379\n")
              f.write(f"JWT_SECRET={jwt_secret}\n")
              f.write("PORT=3000\n")
          PY

      - name: Validate deployment configuration
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Error: deployment file must use published images, not build:"
            exit 1
          fi

          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull Docker Hub images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy application
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify application and services
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "Backend, PostgreSQL and Redis are healthy"
              break
            fi

            if [ "$attempt" -eq 40 ]; then
              echo "Deployment health check failed"
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi

            sleep 3
          done

          curl --fail --silent http://localhost:8080/ > /dev/null
          echo "Frontend is responding successfully"

          docker compose -f docker-compose.deploy.yml ps

      - name: Cleanup deployment
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml down --remove-orphans || true
