
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Publish and Verify Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment file
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
          } > .env

      - name: Validate deployment Compose
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi

          docker compose -f docker-compose.deploy.yml config --quiet
          docker compose -f docker-compose.deploy.yml config --images

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d --wait

      - name: Verify backend and frontend
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3001/health; then
              echo
              echo "Backend, PostgreSQL and Redis are healthy"
              break
            fi

            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi

            sleep 3
          done

          curl --fail --silent http://localhost:8081/ > /dev/null
          echo "Frontend is responding successfully"

      - name: Verify Redis
        run: |
          docker compose -f docker-compose.deploy.yml exec -T redis redis-cli ping

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3001
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Backend: `${{ secrets.DOCKERHUB_USERNAME }}/backend:v1`"
            echo "- Backend: `${{ secrets.DOCKERHUB_USERNAME }}/backend:latest`"
            echo "- Frontend: `${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1`"
            echo "- Frontend: `${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest`"
            echo "- Commit: `${GITHUB_SHA}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
