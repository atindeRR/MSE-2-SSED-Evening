
name: TaskFlow Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest

      - name: Pull deployment images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy application
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for i in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' taskflow-backend 2>/dev/null)" = "healthy" ]; then
              break
            fi
            sleep 5
          done

          docker compose -f docker-compose.deploy.yml ps

          test "$(docker inspect --format='{{.State.Health.Status}}' taskflow-backend)" = "healthy"

          curl --fail http://localhost:3000/health
          curl --fail http://localhost:8080/health
