name: Docker Practical - Build, Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Docker Hub images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag images with v1 and latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag "$DOCKERHUB_USERNAME/frontend:latest" "$DOCKERHUB_USERNAME/frontend:v1"
          docker tag "$DOCKERHUB_USERNAME/backend:latest" "$DOCKERHUB_USERNAME/backend:v1"
          docker images "$DOCKERHUB_USERNAME" --format '{{.Repository}}:{{.Tag}}'

      - name: Push all four tags to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for image in frontend backend; do
            for tag in v1 latest; do
              docker push "$DOCKERHUB_USERNAME/$image:$tag"
            done
          done

      - name: Verify published tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for image in frontend backend; do
            for tag in v1 latest; do
              docker buildx imagetools inspect "$DOCKERHUB_USERNAME/$image:$tag" > /dev/null
              echo "Verified $DOCKERHUB_USERNAME/$image:$tag"
            done
          done

  deploy:
    name: Deploy published images and smoke test
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "Missing POSTGRES_PASSWORD secret"; exit 1; }

      - name: Login to Docker Hub for image pull
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create deployment environment file from secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          {
            printf '%s\n' "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
            printf '%s\n' "POSTGRES_DB=taskflow"
            printf '%s\n' "POSTGRES_USER=taskflow_user"
            printf '%s\n' "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            printf '%s\n' "JWT_SECRET=$JWT_SECRET"
          } > .env
          echo "Created deployment .env (values hidden)"

      - name: Validate image-based deployment Compose file
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "docker-compose.deploy.yml must not contain build: directives"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet
          echo "Deployment Compose file uses published images only"

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Start deployment stack
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify all services are running and healthy
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              echo "Backend API is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Backend never became healthy"
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null || { echo "Frontend did not respond"; exit 1; }
          echo "Frontend is responding"
          for service in frontend backend postgres redis; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "taskflow-deploy-$service")"
            echo "$service health: $status"
            test "$status" = "healthy" || exit 1
          done
          docker compose -f docker-compose.deploy.yml ps

      - name: Run API tests against published-image deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Publish workflow summary
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "## Docker practical CI/CD"
            echo ""
            echo "- Frontend: \`$DOCKERHUB_USERNAME/frontend:v1\`, \`$DOCKERHUB_USERNAME/frontend:latest\`"
            echo "- Backend: \`$DOCKERHUB_USERNAME/backend:v1\`, \`$DOCKERHUB_USERNAME/backend:latest\`"
            echo "- Deployment: \`docker-compose.deploy.yml\` on the GitHub Actions runner"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.deploy.yml ps || true
          docker compose -f docker-compose.deploy.yml logs --no-color || true

      - name: Clean up test deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
