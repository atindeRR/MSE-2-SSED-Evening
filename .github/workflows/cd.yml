name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build frontend
      - name: Build frontend image
        run: docker build -t frontend-local ./frontend

      # 4. Build backend
      - name: Build backend image
        run: docker build -t backend-local ./backend

      # 5. Docker Hub authentication
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Tag frontend v1/latest
      - name: Tag frontend images
        run: |
          docker tag frontend-local ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
          docker tag frontend-local ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      # 7. Tag backend v1/latest
      - name: Tag backend images
        run: |
          docker tag backend-local ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
          docker tag backend-local ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      # 8. Push all four tags
      - name: Push all tags to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      # 9. Deploy using docker-compose.deploy.yml
      - name: Substitute Docker Hub username in deploy compose file
        run: sed -i "s|YOUR_DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" docker-compose.deploy.yml

      - name: Deploy with docker-compose.deploy.yml
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose -f docker-compose.deploy.yml up -d

      # 10. Verify services/application
      - name: Verify services are running
        run: |
          sleep 30
          docker compose -f docker-compose.deploy.yml ps
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/health; then
              echo "Backend is healthy"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose -f docker-compose.deploy.yml logs
              exit 1
            fi
            sleep 5
          done
