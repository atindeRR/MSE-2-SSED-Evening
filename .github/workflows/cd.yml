name: Build, Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Publish images and verify deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "Missing POSTGRES_PASSWORD secret"; exit 1; }
          test -n "$JWT_SECRET" || { echo "Missing JWT_SECRET secret"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Validate published-image deployment configuration
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images and deploy
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 180

      - name: Verify frontend and backend health
        shell: bash
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health > /dev/null \
              && curl --fail --silent http://localhost:8080/ > /dev/null \
              && curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "Frontend, backend, PostgreSQL and Redis are responding"
              exit 0
            fi
            echo "Waiting for application health ($attempt/40)..."
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --no-color
          exit 1

      - name: Install API test dependencies
        working-directory: tests
        run: npm ci

      - name: Run API tests against published-image deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test

      - name: Clean up deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans
