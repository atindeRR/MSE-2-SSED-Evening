
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish student's images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout student's repository
        uses: actions/checkout@v4

      - name: Checkout instructor-controlled evaluation files
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: instructor-evaluation

      - name: Validate required Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}

      - name: Create deployment environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=deployment_change_me
          DATABASE_URL=postgresql://taskflow_user:deployment_change_me@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=replace_with_a_long_random_secret
          PORT=3000
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml

          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi

          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Smoke test
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health; then
              echo "Healthy after $attempt attempt(s)"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 3
          done
          echo "Smoke test failed"
          docker compose ps
          docker compose logs
          exit 1

      - name: Install test dependencies
        working-directory: instructor-evaluation/tests
        run: npm install

      - name: Run API and Redis tests against Docker Hub deployment
        working-directory: instructor-evaluation/tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Backend: `${{ secrets.DOCKERHUB_USERNAME }}/backend:latest`"
            echo "- Frontend: `${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest`"
            echo "- Commit: `${GITHUB_SHA}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
