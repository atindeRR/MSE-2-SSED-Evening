name: Build, publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push v1 and latest images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker image tag "$DOCKERHUB_USERNAME/frontend:latest" "$DOCKERHUB_USERNAME/frontend:v1"
          docker image tag "$DOCKERHUB_USERNAME/backend:latest" "$DOCKERHUB_USERNAME/backend:v1"
          docker image push "$DOCKERHUB_USERNAME/frontend:v1"
          docker image push "$DOCKERHUB_USERNAME/frontend:latest"
          docker image push "$DOCKERHUB_USERNAME/backend:v1"
          docker image push "$DOCKERHUB_USERNAME/backend:latest"

      - name: Create deployment environment
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          printf 'DOCKERHUB_USERNAME=%s\nPOSTGRES_DB=taskflow\nPOSTGRES_USER=taskflow_user\nPOSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' \
            "$DOCKERHUB_USERNAME" "$POSTGRES_PASSWORD" "$(openssl rand -hex 32)" > .env

      - name: Validate image-based Compose configuration
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must not build the application images"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy published images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify container health and application endpoints
        run: |
          for service in postgres redis backend frontend; do
            container_id="$(docker compose -f docker-compose.deploy.yml ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "No container was created for $service"
              docker compose -f docker-compose.deploy.yml ps
              exit 1
            fi
            healthy=false
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
              if [ "$status" = "healthy" ]; then
                healthy=true
                break
              fi
              sleep 3
            done
            if [ "$healthy" != true ]; then
              echo "$service did not become healthy (last status: $status)"
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color "$service"
              exit 1
            fi
            echo "$service is healthy"
          done
          curl --fail --silent http://localhost:3000/health
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8080/ > /dev/null

      - name: Run API tests against the deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Show deployment status
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --no-color

      - name: Stop deployment containers
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans
