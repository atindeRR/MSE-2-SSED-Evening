name: CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend (v1 + latest)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and push backend (v1 + latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Create env file from secrets
        run: |
          echo "POSTGRES_DB=taskflow" >> .env
          echo "POSTGRES_USER=taskflow_user" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env

      - name: Deploy using docker-compose.deploy.yml
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f docker-compose.deploy.yml ps -q backend))
            echo "backend: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 5
          done
          docker compose -f docker-compose.deploy.yml logs
          exit 1

      - name: Verify application and services
        run: |
          docker compose -f docker-compose.deploy.yml ps
          curl -f http://localhost:8080
          docker compose -f docker-compose.deploy.yml exec -T redis redis-cli ping
          docker compose -f docker-compose.deploy.yml exec -T postgres pg_isready -U taskflow_user -d taskflow
