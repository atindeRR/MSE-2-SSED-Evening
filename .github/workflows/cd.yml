name: CD - Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Build, push to Docker Hub and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build frontend image
        run: docker build -t "$DOCKERHUB_USERNAME/frontend:v1" ./frontend

      - name: 4. Build backend image
        run: docker build -t "$DOCKERHUB_USERNAME/backend:v1" ./backend

      - name: 5. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 6. Tag images with v1 and latest
        run: |
          docker tag "$DOCKERHUB_USERNAME/frontend:v1" "$DOCKERHUB_USERNAME/frontend:latest"
          docker tag "$DOCKERHUB_USERNAME/backend:v1"  "$DOCKERHUB_USERNAME/backend:latest"
          docker images | grep "$DOCKERHUB_USERNAME"

      - name: 7. Push all image tags to Docker Hub
        run: |
          docker push "$DOCKERHUB_USERNAME/frontend:v1"
          docker push "$DOCKERHUB_USERNAME/frontend:latest"
          docker push "$DOCKERHUB_USERNAME/backend:v1"
          docker push "$DOCKERHUB_USERNAME/backend:latest"

      - name: Create deployment .env from secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgresql://taskflow_user:${POSTGRES_PASSWORD}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=${JWT_SECRET}
          PORT=3000
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          EOF

      - name: 8. Deploy using docker-compose.deploy.yml
        run: |
          docker image rm "$DOCKERHUB_USERNAME/frontend:latest" "$DOCKERHUB_USERNAME/backend:latest" || true
          docker compose -f docker-compose.deploy.yml config --quiet
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --wait

      - name: 9. Verify application and services
        run: |
          docker compose -f docker-compose.deploy.yml ps
          curl --fail --silent --show-error http://localhost:3000/health
          echo
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null && echo "Frontend OK"
          curl --fail --silent --show-error http://localhost:8080/health
          echo

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.deploy.yml ps -a || true
          docker compose -f docker-compose.deploy.yml logs --no-color || true

      - name: Cleanup deployment
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
          rm -f .env
