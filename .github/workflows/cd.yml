name: Build, publish and verify Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "Missing POSTGRES_PASSWORD"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Prepare temporary deployment environment
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python3 - <<'PY'
          import os, secrets
          values = {
              "DOCKERHUB_USERNAME": os.environ["DOCKERHUB_USERNAME"],
              "POSTGRES_DB": "taskflow",
              "POSTGRES_USER": "taskflow_user",
              "JWT_SECRET": secrets.token_urlsafe(48),
              "PORT": "3000",
          }
          with open(".env", "w", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
          PY

      - name: Validate Compose configurations
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Start image-based deployment on the runner
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify services and application routes
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ >/dev/null
          curl --fail --silent http://localhost:8080/health >/dev/null
          docker compose -f docker-compose.deploy.yml ps

      - name: Summarize published image references
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "## Published images and runner verification"
            echo ""
            echo "- Frontend: \`$DOCKERHUB_USERNAME/frontend:v1\`, \`$DOCKERHUB_USERNAME/frontend:latest\`"
            echo "- Backend: \`$DOCKERHUB_USERNAME/backend:v1\`, \`$DOCKERHUB_USERNAME/backend:latest\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Deployment was verified on this temporary GitHub-hosted runner; it is not permanent hosting."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop runner deployment
        if: always()
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans || true
