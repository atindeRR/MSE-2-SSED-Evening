name: TaskFlow - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-verify:
    name: Publish images and verify deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required secrets and Docker Hub namespace
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)
          namespace="$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')"
          test "$namespace" = "nischhallll" || (echo "DOCKERHUB_USERNAME must identify the nischhallll Docker Hub account" && exit 1)
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend images
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.credentials.outputs.namespace }}/frontend:v1
            ${{ steps.credentials.outputs.namespace }}/frontend:latest

      - name: Build and push backend images
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.credentials.outputs.namespace }}/backend:v1
            ${{ steps.credentials.outputs.namespace }}/backend:latest

      - name: Create temporary deployment environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import secrets
          from urllib.parse import quote

          password = os.environ["POSTGRES_PASSWORD"]
          jwt_secret = secrets.token_urlsafe(48)

          def env_value(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          with open(".env", "w", encoding="utf-8") as env_file:
              env_file.write("POSTGRES_DB=taskflow\n")
              env_file.write("POSTGRES_USER=taskflow_user\n")
              env_file.write(f"POSTGRES_PASSWORD={env_value(password)}\n")
              env_file.write(
                  "DATABASE_URL="
                  + env_value(
                      "postgresql://taskflow_user:"
                      + quote(password, safe="")
                      + "@postgres:5432/taskflow"
                  )
                  + "\n"
              )
              env_file.write("REDIS_URL=redis://redis:6379\n")
              env_file.write(f"JWT_SECRET={env_value(jwt_secret)}\n")
              env_file.write("PORT=3000\n")
          PY

      - name: Validate deployment Compose
        run: docker compose -f docker-compose.deploy.yml -p taskflow-mse2-ci config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml -p taskflow-mse2-ci pull

      - name: Start image-based deployment on the temporary runner
        run: docker compose -f docker-compose.deploy.yml -p taskflow-mse2-ci up -d --wait --wait-timeout 180

      - name: Verify deployment and service health
        run: |
          for service in postgres redis backend frontend; do
            container_id="$(docker compose -f docker-compose.deploy.yml -p taskflow-mse2-ci ps -q "$service")"
            test -n "$container_id"
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            test "$status" = "healthy" || (echo "$service health status: $status" && exit 1)
          done
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null

      - name: Set up Node.js for API tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Run API tests against published images
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Record runner deployment limitation
        if: always()
        run: |
          {
            echo "## TaskFlow deployment verification"
            echo ""
            echo "Images: \`${{ steps.credentials.outputs.namespace }}/frontend:v1\`, \`${{ steps.credentials.outputs.namespace }}/frontend:latest\`, \`${{ steps.credentials.outputs.namespace }}/backend:v1\`, and \`${{ steps.credentials.outputs.namespace }}/backend:latest\`."
            echo ""
            echo "The Compose deployment and tests run on this temporary GitHub-hosted runner; this does not create a persistent public deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary deployment
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f docker-compose.deploy.yml -p taskflow-mse2-ci down --remove-orphans
          fi
