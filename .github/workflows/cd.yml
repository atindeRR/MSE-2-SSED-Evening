name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-deploy:
    name: Publish and verify Docker Hub images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: taskflow-cd-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate required secrets and Docker Hub namespace
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Missing DOCKERHUB_USERNAME secret"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Missing DOCKERHUB_TOKEN secret"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "::error::Missing POSTGRES_PASSWORD secret"; exit 1; }
          if [ "$DOCKERHUB_USERNAME" != "itygaur23" ]; then
            echo "::error::DOCKERHUB_USERNAME must be configured as itygaur23"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend images
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            itygaur23/backend:v1
            itygaur23/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend images
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            itygaur23/frontend:v1
            itygaur23/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull, deploy and verify published images
        id: deploy
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEPLOY_FRONTEND_PORT: 8082
        run: |
          set -euo pipefail
          export POSTGRES_DB=taskflow
          export POSTGRES_USER=taskflow_user
          export REDIS_URL=redis://redis:6379
          export PORT=3000
          encoded_password="$(node -e 'process.stdout.write(encodeURIComponent(process.env.POSTGRES_PASSWORD))')"
          export DATABASE_URL="postgresql://taskflow_user:${encoded_password}@postgres:5432/taskflow"
          export JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"

          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml config --quiet
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml pull
          if ! docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml up -d --wait --wait-timeout 180; then
            docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml ps
            docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml logs --tail 100 --no-color
            exit 1
          fi
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml ps

          base_url="http://localhost:${DEPLOY_FRONTEND_PORT}"
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused \
            --output /dev/null --write-out 'Frontend HTTP %{http_code}\n' "$base_url/"
          health_json="$(curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused "$base_url/health")"
          printf 'Proxied /health response: %s\n' "$health_json"
          printf '%s\n' "$health_json" | jq --exit-status '.status == "ok" and .postgres == "ok" and .redis == "ok"'

      - name: Run API tests through the frontend proxy
        working-directory: tests
        env:
          BASE_URL: http://localhost:8082
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication and deployment"
            echo ""
            echo "- Backend: \`itygaur23/backend:v1\`, \`itygaur23/backend:latest\`"
            echo "- Frontend: \`itygaur23/frontend:v1\`, \`itygaur23/frontend:latest\`"
            echo "- Deployment Compose: \`docker-compose.deploy.yml\`"
            echo "- Deployment frontend port: \`8082\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
