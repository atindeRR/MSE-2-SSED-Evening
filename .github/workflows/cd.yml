name: Docker Practical - Build, Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish-deploy:
    name: Build, publish and verify TaskFlow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -e
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::DOCKERHUB_USERNAME secret is missing"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::DOCKERHUB_TOKEN secret is missing"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "::error::POSTGRES_PASSWORD secret is missing"; exit 1; }
          echo "All required secrets are present"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image (v1 + latest)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          cache-from: type=gha,scope=taskflow-frontend
          cache-to: type=gha,mode=max,scope=taskflow-frontend

      - name: Build and push backend image (v1 + latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
          cache-from: type=gha,scope=taskflow-backend
          cache-to: type=gha,mode=max,scope=taskflow-backend

      - name: Verify all four published tags
        run: |
          set -e
          for tag in frontend:v1 frontend:latest backend:v1 backend:latest; do
            docker manifest inspect "$DOCKERHUB_USERNAME/$tag" > /dev/null
            echo "Verified published tag: $DOCKERHUB_USERNAME/$tag"
          done

      - name: Create deployment environment file from secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -e
          JWT_SECRET="$(openssl rand -hex 32)"
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=postgresql://taskflow_user:$POSTGRES_PASSWORD@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=$JWT_SECRET
          PORT=3000
          DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
          EOF
          echo "Created .env with secret-backed values (not committed)"

      - name: Validate image-based deployment Compose
        run: |
          set -e
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "::error::docker-compose.deploy.yml must not contain build: directives"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet
          echo "Deployment Compose uses published images only"

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using published Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Wait for backend and frontend health
        run: |
          set -e
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend health OK"
              break
            fi
            echo "Waiting for backend ($attempt/40)..."
            if [ "$attempt" -eq 40 ]; then
              echo "::error::Backend did not become healthy"
              exit 1
            fi
            sleep 3
          done
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ | grep -q 'TaskFlow'; then
              echo "Frontend HTTP 200 with TaskFlow content"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Frontend did not respond correctly"
              exit 1
            fi
            sleep 3
          done

      - name: Verify service health statuses
        run: |
          set -e
          docker compose -f docker-compose.deploy.yml ps
          for service in postgres redis backend; do
            container="$(docker compose -f docker-compose.deploy.yml ps -q "$service")"
            status="$(docker inspect --format='{{.State.Health.Status}}' "$container")"
            echo "$service health: $status"
            test "$status" = "healthy" || { echo "::error::$service is not healthy"; exit 1; }
          done

      - name: Run API smoke tests against deployed images
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          set -e
          npm ci --no-audit --no-fund
          npm test

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Docker Practical CD"
            echo ""
            echo "- Frontend: \`${DOCKERHUB_USERNAME}/frontend:v1\`, \`${DOCKERHUB_USERNAME}/frontend:latest\`"
            echo "- Backend: \`${DOCKERHUB_USERNAME}/backend:v1\`, \`${DOCKERHUB_USERNAME}/backend:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployment: GitHub Actions runner using \`docker-compose.deploy.yml\` (temporary, not production)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.deploy.yml ps || true
          docker compose -f docker-compose.deploy.yml logs --no-color || true

      - name: Cleanup containers
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
