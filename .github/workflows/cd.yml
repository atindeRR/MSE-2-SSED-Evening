
name: Docker Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || exit 1
          test -n "$DOCKERHUB_TOKEN" || exit 1
          test -n "$POSTGRES_PASSWORD" || exit 1
          test -n "$JWT_SECRET" || exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Create deployment environment
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DATABASE_URL=postgresql://taskflow_user:$POSTGRES_PASSWORD@postgres:5432/taskflow"
            echo "REDIS_URL=redis://redis:6379"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "PORT=3000"
          } > .env

      - name: Validate deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images"
            exit 1
          fi
          docker compose --env-file .env -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose --env-file .env -f docker-compose.deploy.yml pull

      - name: Deploy application
        run: docker compose --env-file .env -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo "Backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose --env-file .env -f docker-compose.deploy.yml ps
              docker compose --env-file .env -f docker-compose.deploy.yml logs
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null
          echo "Frontend is responding"

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published images
        run: |
          {
            echo "## Docker Hub Images"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:v1"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:v1"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file .env -f docker-compose.deploy.yml down -v --remove-orphans || true
