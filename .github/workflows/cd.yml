
name: TaskFlow Docker CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Deploy and verify
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          docker compose -f docker-compose.deploy.yml up -d
          docker compose -f docker-compose.deploy.yml ps
          sleep 20
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml exec -T backend node -e "fetch('http://localhost:3000/health').then(async r => { console.log(await r.text()); if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
          docker compose -f docker-compose.deploy.yml down
