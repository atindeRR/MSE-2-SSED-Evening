name: TaskFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node cache for API tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        run: |
          # Pull requests from forks do not receive repository secrets. This isolated test
          # database uses an ephemeral random password; publication uses the repository secret.
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          JWT_SECRET="$(openssl rand -hex 32)"
          {
            printf 'POSTGRES_DB=taskflow\n'
            printf 'POSTGRES_USER=taskflow_user\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'FRONTEND_IMAGE=taskflow-frontend\n'
            printf 'BACKEND_IMAGE=taskflow-backend\n'
            printf 'IMAGE_TAG=ci\n'
          } > .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build frontend and backend images
        run: docker compose build

      - name: Start the application stack
        run: docker compose up -d

      - name: Wait for API and frontend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health && curl --fail --silent http://localhost:8080/health; then
              echo "API and reverse proxy are healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run API test suite
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Capture service status
        if: always()
        run: docker compose ps

      - name: Clean up test containers without deleting the database volume
        if: always()
        run: docker compose down --remove-orphans

  publish-and-verify:
    name: Publish Docker Hub images and verify image deployment
    needs: test-and-build
    # Pull requests prove builds and tests but never receive Docker Hub credentials or push images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend tags
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend tags
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create image-deployment environment file
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          {
            printf 'POSTGRES_DB=taskflow\n'
            printf 'POSTGRES_USER=taskflow_user\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
            printf 'FRONTEND_IMAGE=%s/frontend\n' "$DOCKERHUB_USERNAME"
            printf 'BACKEND_IMAGE=%s/backend\n' "$DOCKERHUB_USERNAME"
            printf 'IMAGE_TAG=latest\n'
          } > .env

      - name: Validate image-only deployment Compose file
        run: |
          ! grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Deploy published images on the verification runner
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployed application
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health && curl --fail --silent http://localhost:8080/health; then
              echo "Published images deployed successfully"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --no-color
          exit 1

      - name: Clean up verification containers without deleting the database volume
        if: always()
        run: docker compose -f docker-compose.deploy.yml down --remove-orphans
