
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || exit 1
          test -n "$DOCKERHUB_TOKEN" || exit 1
          test -n "$POSTGRES_PASSWORD" || exit 1
          test -n "$JWT_SECRET" || exit 1
          test "$DOCKERHUB_USERNAME" = "vaishnavirai44" || exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            vaishnavirai44/backend:v1
            vaishnavirai44/backend:latest
            vaishnavirai44/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            vaishnavirai44/frontend:v1
            vaishnavirai44/frontend:latest
            vaishnavirai44/frontend:${{ github.sha }}

      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "DOCKERHUB_USERNAME=vaishnavirai44"
          } > .env

      - name: Validate deployment Compose
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment must use Docker Hub images"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull Docker Hub images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy application
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8083/health; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)"
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --no-color
          exit 1

      - name: Verify frontend
        run: curl --fail --silent http://localhost:8083/ > /dev/null

      - name: Install API test dependencies
        working-directory: tests
        run: npm ci

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:8083
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test

      - name: Record published images
        run: |
          {
            echo "## Docker Hub Publication"
            echo ""
            echo "- Backend: vaishnavirai44/backend:latest"
            echo "- Frontend: vaishnavirai44/frontend:latest"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show deployment status
        if: always()
        run: docker compose -f docker-compose.deploy.yml ps || true

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
