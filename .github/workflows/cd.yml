name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Build, Publish to Docker Hub and Verify Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then echo "::error::Missing DOCKERHUB_USERNAME secret"; exit 1; fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then echo "::error::Missing DOCKERHUB_TOKEN secret"; exit 1; fi
          if [ -z "$POSTGRES_PASSWORD" ]; then echo "::error::Missing POSTGRES_PASSWORD secret"; exit 1; fi
          echo "All required secrets are present."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image (v1 and latest)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend image (v1 and latest)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment file (.env)
        run: |
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql://taskflow_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=cd_pipeline_jwt_secret_token_12345
          PORT=3000
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      - name: Validate image-based deployment Compose configuration
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "::error::Deployment Compose must not contain build: directives"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images from Docker Hub
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy application stack using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify backend health endpoint
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Deployment backend is healthy and connected to PostgreSQL and Redis"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::Backend failed to become healthy within timeout"
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done

      - name: Verify frontend response
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is responding on port 8080"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Frontend failed to respond"
              docker compose -f docker-compose.deploy.yml logs frontend
              exit 1
            fi
            sleep 3
          done

      - name: Run API integration tests against deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record publication and deployment summary
        if: always()
        run: |
          {
            echo "## Docker Hub Publication & Deployment Summary"
            echo ""
            echo "- Backend Image: \`${{ secrets.DOCKERHUB_USERNAME }}/backend:latest\` & \`v1\`"
            echo "- Frontend Image: \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest\` & \`v1\`"
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Deployment Test: Passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
