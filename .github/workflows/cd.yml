name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: taskflow-cd-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out the application
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate required repository secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          : "${DOCKERHUB_USERNAME:?Configure the DOCKERHUB_USERNAME repository secret}"
          : "${DOCKERHUB_TOKEN:?Configure the DOCKERHUB_TOKEN repository secret}"
          : "${POSTGRES_PASSWORD:?Configure the POSTGRES_PASSWORD repository secret}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ env.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and publish the backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/backend:v1
            ${{ env.DOCKERHUB_USERNAME }}/backend:latest

      - name: Verify all four tags in Docker Hub
        run: |
          for image in frontend backend; do
            for tag in v1 latest; do
              docker buildx imagetools inspect "$DOCKERHUB_USERNAME/$image:$tag" > /dev/null
              printf 'Found %s:%s in Docker Hub\n' "$image" "$tag"
            done
          done

      - name: Generate a JWT secret for this deployment
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - name: Deploy the published images on the runner
        id: deploy
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose -f docker-compose.deploy.yml config --quiet
          docker compose -f docker-compose.deploy.yml up -d --no-build --pull always --wait --wait-timeout 180
          docker compose -f docker-compose.deploy.yml ps

      - name: Verify the frontend and backend respond
        run: |
          frontend="$(curl --fail --silent --show-error --retry 5 --retry-connrefused --max-time 10 http://127.0.0.1:8080/)"
          grep --fixed-strings --quiet '<title>TaskFlow</title>' <<< "$frontend"
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/health
          echo

      - name: Set up Node.js for the API tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify TaskFlow through the frontend proxy
        working-directory: tests
        env:
          BASE_URL: http://127.0.0.1:8080
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Show deployment diagnostics on failure
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose -f docker-compose.deploy.yml ps --all
          docker compose -f docker-compose.deploy.yml logs --no-color --tail 200

      - name: Remove the runner deployment
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose -f docker-compose.deploy.yml down --volumes --remove-orphans
