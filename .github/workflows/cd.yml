
name: Evening Shift Docker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
  
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            mahimabhat10/backend:v1
            mahimabhat10/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            mahimabhat10/frontend:v1
            mahimabhat10/frontend:latest

      - name: Verify deployment compose
        run: docker compose -f docker-compose.deploy.yml config --quiet
