name: Docker Practical - Build, Publish, Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish-deploy:
    name: Build, publish and verify TaskFlow
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required GitHub Secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -e
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)
          test -n "$JWT_SECRET" || (echo "Missing JWT_SECRET secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend v1 and latest
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend v1 and latest
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment file
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          umask 077
          {
            printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
          } > .env

      - name: Validate image-based deployment configuration
        run: |
          docker compose -f docker-compose.deploy.yml config --quiet
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          grep -q 'image:.*\/frontend:latest' docker-compose.deploy.yml
          grep -q 'image:.*\/backend:latest' docker-compose.deploy.yml

      - name: Pull published Docker Hub images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using published images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify backend, frontend and service health
        run: |
          set -e
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend, PostgreSQL and Redis are healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is responding"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose -f docker-compose.deploy.yml logs frontend
              exit 1
            fi
            sleep 3
          done

          docker compose -f docker-compose.deploy.yml ps

      - name: Run API integration tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm ci
          npm test

      - name: Verify PostgreSQL volume persistence
        run: |
          set -e
          docker compose -f docker-compose.deploy.yml exec -T postgres psql -U postgres -d taskflow -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS docker_persistence_probe (id TEXT PRIMARY KEY);" \
            -c "INSERT INTO docker_persistence_probe (id) VALUES ('volume-survives') ON CONFLICT DO NOTHING;"
          docker compose -f docker-compose.deploy.yml up -d --force-recreate postgres

          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f docker-compose.deploy.yml ps -q postgres)")" = "healthy" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f docker-compose.deploy.yml logs postgres
              exit 1
            fi
            sleep 2
          done

          docker compose -f docker-compose.deploy.yml exec -T postgres psql -U postgres -d taskflow -tAc \
            "SELECT id FROM docker_persistence_probe WHERE id = 'volume-survives'" | grep -qx 'volume-survives'

      - name: Verify Redis restart and backend reconnection
        run: |
          set -e
          docker compose -f docker-compose.deploy.yml restart redis
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              echo "Backend reconnected and Redis is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs backend redis
          exit 1

      - name: Publish workflow summary
        if: always()
        run: |
          {
            echo "## Docker Hub images"
            echo ""
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1 and latest"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1 and latest"
            echo "- Deployment: docker-compose.deploy.yml"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true