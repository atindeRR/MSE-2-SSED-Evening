
name: Docker Practical - Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT: ${{ secrets.JWT_SECRET }}
        run: |
          printf 'DOCKERHUB_USERNAME=%s\nPOSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' \
            "$USERNAME" "$DB_PASSWORD" "$JWT" > .env

      - name: Validate deployment Compose
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy application
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8081/health; then
              echo "Application is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8081/ > /dev/null

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:8081
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record image references
        run: |
          {
            echo "## Docker Hub Images"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1"
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
