name: TaskFlow CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            anjaligurjar/taskflow-frontend:v1
            anjaligurjar/taskflow-frontend:latest

      # 5. Build and push backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            anjaligurjar/taskflow-backend:v1
            anjaligurjar/taskflow-backend:latest

      # 6. Deploy using published images
      - name: Deploy Application
        run: |
          docker compose -f docker-compose.deploy.yml up -d

      # 7. Verify deployment
      - name: Verify Deployment
        run: |
          docker compose -f docker-compose.deploy.yml ps
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8080/health