name: Docker Practical - CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Create deployment environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql://taskflow_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci_deployment_secret_key_replace_me
          PORT=3000
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      - name: Deploy using docker-compose.deploy.yml
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)..."
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose -f docker-compose.deploy.yml ps
          docker compose -f docker-compose.deploy.yml logs --no-color
          exit 1

      - name: Verify frontend is responding
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml logs frontend
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test

      - name: Verify services are running
        run: |
          docker compose -f docker-compose.deploy.yml ps
          echo "---"
          docker network ls
          echo "---"
          docker volume ls

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
