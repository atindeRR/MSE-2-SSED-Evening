name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend

jobs:
  publish:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build frontend image
        run: docker build -t "$FRONTEND_IMAGE:latest" ./frontend

      - name: 4. Build backend image
        run: docker build -t "$BACKEND_IMAGE:latest" ./backend

      - name: 5. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 6. Tag images with v1 and latest
        run: |
          docker tag "$FRONTEND_IMAGE:latest" "$FRONTEND_IMAGE:v1"
          docker tag "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE:v1"
          docker image ls --filter "reference=$FRONTEND_IMAGE" --filter "reference=$BACKEND_IMAGE"

      - name: 7. Push all tags to Docker Hub
        run: |
          docker push "$FRONTEND_IMAGE:v1"
          docker push "$FRONTEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:v1"
          docker push "$BACKEND_IMAGE:latest"

      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DATABASE_URL=postgresql://taskflow_user:$POSTGRES_PASSWORD@postgres:5432/taskflow"
            echo "REDIS_URL=redis://redis:6379"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PORT=3000"
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
          } > .env

      - name: Validate deployment Compose (no build allowed)
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: 8. Deploy using docker-compose.deploy.yml
        run: |
          docker image rm "$FRONTEND_IMAGE:latest" "$BACKEND_IMAGE:latest" || true
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      - name: 9. Verify application and services
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/ > /dev/null && echo "Frontend is responding"
          curl --fail --silent http://localhost:8080/health && echo && echo "Frontend -> backend proxy works"
          docker compose -f docker-compose.deploy.yml ps

      - name: Run API tests against deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published images
        run: |
          {
            echo "## Docker Hub publication"
            echo "- \`$BACKEND_IMAGE:v1\`, \`$BACKEND_IMAGE:latest\`"
            echo "- \`$FRONTEND_IMAGE:v1\`, \`$FRONTEND_IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
