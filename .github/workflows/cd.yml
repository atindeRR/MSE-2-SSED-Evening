name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend
        run: |
          docker build -t frontend:local ./frontend

      - name: Build backend
        run: |
          docker build -t backend:local ./backend

      - name: Docker Hub login (secrets)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag v1 and latest
        run: |
          docker tag frontend:local ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
          docker tag frontend:local ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          docker tag backend:local ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
          docker tag backend:local ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Push
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Deploy using docker-compose.deploy.yml
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cat > .env <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql://taskflow_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=super_secret_jwt_token_key_aiml_2024
          PORT=3000
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d

      - name: Verify health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health && curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Containers are healthy and responding"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done
          docker compose -f docker-compose.deploy.yml ps
          curl --fail --silent http://localhost:8080/health

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
