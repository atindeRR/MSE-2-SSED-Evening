name: Docker Practical - CI Evaluation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Validate, build and test submission
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: taskflow-ci

    steps:
      - name: Checkout submitted Pull Request commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show submission identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          if [ -f submission.json ]; then
            echo "submission.json is present"
          else
            echo "::warning::submission.json is missing"
          fi

      - name: Check required files
        run: |
          required_files=(
            docker-compose.yml
            docker-compose.deploy.yml
            .env.example
            backend/Dockerfile
            backend/package.json
            backend/package-lock.json
            backend/db/init.sql
            frontend/Dockerfile
            frontend/package.json
            frontend/package-lock.json
            .github/workflows/ci.yml
            .github/workflows/cd.yml
            tests/package.json
            tests/package-lock.json
            tests/api.test.js
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done
          echo "All required practical files are present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify reproducible backend dependency installation
        working-directory: backend
        run: npm ci --omit=dev

      - name: Validate frontend Dockerfile
        run: docker run --rm -i hadolint/hadolint < frontend/Dockerfile

      - name: Validate backend Dockerfile
        run: docker run --rm -i hadolint/hadolint < backend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        run: |
          ci_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$ci_password"
          echo "::add-mask::$jwt_secret"
          {
            printf 'POSTGRES_DB=taskflow\n'
            printf 'POSTGRES_USER=taskflow_user\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$ci_password"
            printf 'DATABASE_URL=postgresql://taskflow_user:%s@postgres:5432/taskflow\n' "$ci_password"
            printf 'REDIS_URL=redis://redis:6379\n'
            printf 'JWT_SECRET=%s\n' "$jwt_secret"
            printf 'PORT=3000\n'
            printf 'FRONTEND_PORT=8081\n'
          } > .env

      - name: Validate Docker Compose configuration
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" config --quiet

      - name: Build frontend and backend images
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" build

      - name: Start application stack
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" up -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)..."
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" ps
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color
          exit 1

      - name: Check frontend response
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi
            sleep 3
          done
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs frontend
          exit 1

      - name: Test PostgreSQL persistence
        run: |
          set -euo pipefail
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME")
          marker_key="github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker_value="persistence-${GITHUB_SHA}"
          postgres_user=taskflow_user
          postgres_db=taskflow

          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$postgres_db" \
            -c "CREATE TABLE IF NOT EXISTS ci_persistence_probe (marker_key text PRIMARY KEY, marker_value text NOT NULL)"
          printf "INSERT INTO ci_persistence_probe (marker_key, marker_value) VALUES ('%s', '%s');\n" \
            "$marker_key" "$marker_value" |
            "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$postgres_db"
          before="$(printf "SELECT marker_value FROM ci_persistence_probe WHERE marker_key = '%s';\n" "$marker_key" |
            "${compose[@]}" exec -T postgres psql -At -U "$postgres_user" -d "$postgres_db")"
          test "$before" = "$marker_value"
          echo "Marker before PostgreSQL recreation: $before"

          postgres_id_before="$("${compose[@]}" ps -q postgres)"
          volume_before="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$postgres_id_before")"
          test -n "$volume_before"
          echo "PostgreSQL data volume before recreation: $volume_before"
          "${compose[@]}" up -d --no-deps --force-recreate postgres

          postgres_id="$("${compose[@]}" ps -q postgres)"
          for attempt in $(seq 1 40); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id" 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              break
            fi
            sleep 3
            postgres_id="$("${compose[@]}" ps -q postgres)"
          done
          if [ "$health" != healthy ]; then
            "${compose[@]}" ps postgres
            "${compose[@]}" logs --no-color postgres
            echo 'PostgreSQL did not become healthy after recreation.'
            exit 1
          fi

          volume_after="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$postgres_id")"
          test "$volume_after" = "$volume_before"
          after="$(printf "SELECT marker_value FROM ci_persistence_probe WHERE marker_key = '%s';\n" "$marker_key" |
            "${compose[@]}" exec -T postgres psql -At -U "$postgres_user" -d "$postgres_db")"
          test "$after" = "$marker_value"
          echo "PostgreSQL data volume after recreation: $volume_after"
          echo "Marker after PostgreSQL recreation: $after"
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$postgres_user" -d "$postgres_db" \
            -c "DROP TABLE ci_persistence_probe"

      - name: Recover backend after PostgreSQL recreation
        run: |
          set -euo pipefail
          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME")
          "${compose[@]}" start backend
          backend_id="$("${compose[@]}" ps -q backend)"
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Status}}' "$backend_id" 2>/dev/null || true)"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$backend_id" 2>/dev/null || true)"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$status" != running ]; then
              break
            fi
            sleep 3
          done
          if [ "$health" != healthy ]; then
            "${compose[@]}" ps backend
            "${compose[@]}" logs --tail 100 --no-color backend
            echo 'Backend did not recover after PostgreSQL recreation.'
            exit 1
          fi
          curl --fail --silent --show-error http://localhost:3000/health

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Run API and Redis tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test -- --json --outputFile=test-results.json

      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p evaluation-output
          docker compose --project-name "$COMPOSE_PROJECT_NAME" ps > evaluation-output/containers.txt || true
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color > evaluation-output/container-logs.txt || true

      - name: Generate evaluation summary
        if: always()
        run: |
          {
            echo "## Docker Practical CI Evaluation"
            echo ""
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Pull request: \`${{ github.event.pull_request.html_url || 'Manual run' }}\`"
            echo ""
            echo "Review the workflow jobs and uploaded artifacts for detailed results."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-practical-results-${{ github.run_id }}
          path: |
            tests/test-results.json
            evaluation-output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" down --remove-orphans || true
