
name: Docker Practical - CI Evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Validate, Build and Test TaskFlow
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f frontend/Dockerfile
          test -f backend/Dockerfile
          test -f docker-compose.yml
          test -f docker-compose.deploy.yml
          test -f frontend/package.json
          test -f backend/package.json
          echo "All required project files are present."

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=ci_test_password_123
          DATABASE_URL=postgresql://taskflow_user:ci_test_password_123@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci_only_secret_change_for_real_deployment
          PORT=3000
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build frontend and backend images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)..."
            sleep 3
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Check frontend response
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is responding."
              exit 0
            fi
            sleep 3
          done

          docker compose logs frontend
          exit 1

      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p evaluation-output
          docker compose ps > evaluation-output/containers.txt || true
          docker compose logs --no-color > evaluation-output/container-logs.txt || true

      - name: Generate evaluation summary
        if: always()
        run: |
          {
            echo "## TaskFlow CI Evaluation"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Docker Compose validation: completed"
            echo "- Build and deployment checks: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-ci-results-${{ github.run_id }}
          path: evaluation-output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: docker compose down -v --remove-orphans || true
