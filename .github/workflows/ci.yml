
name: Docker Practical - CI Evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Validate, build and test submission
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout submitted commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout instructor evaluation files
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: instructor-evaluation

      - name: Show submission identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          if [ -f submission.json ]; then
            cat submission.json
          else
            echo "::warning::submission.json is missing"
          fi

      - name: Check required files
        run: |
          test -f frontend/Dockerfile
          test -f backend/Dockerfile
          test -f docker-compose.yml
          test -f docker-compose.deploy.yml
          test -f .github/workflows/cd.yml

      - name: Validate frontend Dockerfile
        run: docker run --rm -i hadolint/hadolint < frontend/Dockerfile

      - name: Validate backend Dockerfile
        run: docker run --rm -i hadolint/hadolint < backend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        run: |
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=ci_test_password_123"
            echo "JWT_SECRET=ci_only_secret_for_testing"
            echo "DOCKERHUB_USERNAME=vaishnavirai44"
          } > .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build frontend and backend
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8082/health; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)"
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Check frontend response
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8082/ > /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi
            sleep 3
          done
          docker compose logs frontend
          exit 1

      - name: Install API test dependencies
        working-directory: tests
        run: npm ci

      - name: Run API and Redis tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:8082
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test -- --json --outputFile=test-results.json

      - name: Test PostgreSQL persistence
        run: |
          docker compose exec -T postgres \
            psql -U taskflow_user -d taskflow \
            -c "CREATE TABLE IF NOT EXISTS persistence_test (id INT PRIMARY KEY, message TEXT);"

          docker compose exec -T postgres \
            psql -U taskflow_user -d taskflow \
            -c "INSERT INTO persistence_test VALUES (1, 'Data survived restart') ON CONFLICT (id) DO NOTHING;"

          docker compose up -d --force-recreate postgres

          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres \
              pg_isready -U taskflow_user -d taskflow; then
              break
            fi
            sleep 2
          done

          docker compose exec -T postgres \
            psql -U taskflow_user -d taskflow \
            -tAc "SELECT message FROM persistence_test WHERE id=1" \
            | grep -Fx "Data survived restart"

      - name: Verify Redis after restart
        run: |
          docker compose restart redis
          for attempt in $(seq 1 20); do
            if docker compose exec -T redis redis-cli ping | grep -q PONG; then
              echo "Redis is responding"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p evaluation-output
          docker compose ps > evaluation-output/containers.txt || true
          docker compose logs --no-color > evaluation-output/container-logs.txt || true

      - name: Generate evaluation summary
        if: always()
        run: |
          {
            echo "## Docker Practical CI Evaluation"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "Review workflow logs and artifacts for results."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-practical-results-${{ github.run_id }}
          path: |
            tests/test-results.json
            evaluation-output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: docker compose down -v --remove-orphans || true
