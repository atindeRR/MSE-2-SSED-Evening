name: Docker CI/CD

on:
  push:
    branches:
      - mse2-submission
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            naitik4141/taskflow-frontend:latest
            naitik4141/taskflow-frontend:v1

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            naitik4141/taskflow-backend:latest
            naitik4141/taskflow-backend:v1

      - name: Deploy application using Docker Compose
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          docker compose -f docker-compose.deploy.yml up -d

      - name: Wait for services and verify deployment
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Waiting for application health..."

          for i in $(seq 1 36); do
            if curl -fsS http://localhost:8080/health; then
              echo ""
              echo "Application health check successful!"
              break
            fi

            if [ "$i" -eq 36 ]; then
              echo "Application health check failed!"
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs
              exit 1
            fi

            sleep 5
          done

          echo "Checking PostgreSQL..."
          docker compose -f docker-compose.deploy.yml exec -T postgres \
            pg_isready -U taskflow_user -d taskflow

          echo "Checking Redis..."
          docker compose -f docker-compose.deploy.yml exec -T redis redis-cli ping

          echo "Final deployment status:"
          docker compose -f docker-compose.deploy.yml ps
