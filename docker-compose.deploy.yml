services:
  # ── Frontend (published Docker Hub image) ───────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME}/taskflow-frontend:latest
    ports:
      - "8080:80"
    networks:
      - taskflow_net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend (published Docker Hub image) ────────────────────────────────────
  backend:
    image: ${DOCKERHUB_USERNAME}/taskflow-backend:latest
    ports:
      - "3000:3000"
    env_file: .env
    networks:
      - taskflow_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taskflow_net
    # Port intentionally NOT exposed to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    networks:
      - taskflow_net
    # Port intentionally NOT exposed to the host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  taskflow_net:
    driver: bridge

volumes:
  postgres_data:
