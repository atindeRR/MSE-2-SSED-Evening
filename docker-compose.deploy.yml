# docker-compose.deploy.yml
# Image-based deployment compose file.
# Uses pre-built images from Docker Hub – NO build: directives for frontend or backend.
# Validated by cd.yml: grep -q 'image:' && no 'build:' allowed for app services.
#
# Usage:
#   docker compose -f docker-compose.deploy.yml up -d
#
# Required environment variables (set in .env or export before running):
#   DOCKERHUB_USERNAME  – your Docker Hub username
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   DATABASE_URL, REDIS_URL, JWT_SECRET, PORT

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # Identical config to docker-compose.yml – same volume, same init script.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taskflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    networks:
      - taskflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend – pulled from Docker Hub (no build:)
  # ---------------------------------------------------------------------------
  backend:
    image: ${DOCKERHUB_USERNAME}/backend:latest
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    networks:
      - taskflow-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend – pulled from Docker Hub (no build:)
  # ---------------------------------------------------------------------------
  frontend:
    image: ${DOCKERHUB_USERNAME}/frontend:latest
    ports:
      - "8080:80"
    networks:
      - taskflow-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  taskflow-net:
    driver: bridge

volumes:
  pgdata:
