services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # creates tables on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [taskflow]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [taskflow]
    restart: unless-stopped

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/backend:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}       # host = postgres (service name, not localhost)
      REDIS_URL: ${REDIS_URL}             # host = redis
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [taskflow]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USERNAME:-local}/frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend: { condition: service_healthy }   # nginx.conf proxies /api to backend:3000
    networks: [taskflow]
    restart: unless-stopped

networks:
  taskflow:

volumes:
  postgres_data:
