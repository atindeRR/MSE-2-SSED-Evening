# Local development / CI stack: images are BUILT from source here.
# Usage:  cp .env.example .env   (edit values)   then   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      # Named volume -> data survives removal/recreation of the container
      - postgres_data:/var/lib/postgresql/data
      # Creates the tables on the first start of an empty volume
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - taskflow_net
    # No "ports:" -> reachable only from containers on taskflow_net

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taskflow_net
    # No "ports:" -> not published to the host

  backend:
    build:
      context: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/backend:latest
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      # Service names (postgres / redis) are resolved by Docker's embedded DNS
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_env_file}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - taskflow_net

  frontend:
    build:
      context: ./frontend
    image: ${DOCKERHUB_USERNAME:-local}/frontend:latest
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow_net

networks:
  taskflow_net:
    driver: bridge

volumes:
  postgres_data:
