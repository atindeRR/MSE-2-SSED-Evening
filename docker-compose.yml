services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [taskflow]

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-taskflow}
      PGUSER: ${POSTGRES_USER:-taskflow_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(response => { process.exitCode = response.ok ? 0 : 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s
    networks: [taskflow]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [taskflow]

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [taskflow]

networks:
  taskflow:
    driver: bridge

volumes:
  postgres_data:
