# docker-compose.yml
# Development / CI build compose file.
# Builds frontend and backend images from local source.
# All services communicate over the custom bridge network: taskflow-net.

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # - Named volume pgdata persists data across container restarts and removals.
  # - init.sql is auto-executed by the official image on first startup via
  #   /docker-entrypoint-initdb.d/ (creates users + tasks tables and index).
  # - Port 5432 is NOT exposed to the host (exam requirement).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taskflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7
  # - Port 6379 is NOT exposed to the host (exam requirement).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    networks:
      - taskflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend – Express API (port 3000)
  # - Waits for postgres and redis to be healthy before starting.
  # - DATABASE_URL uses service name "postgres" as the hostname.
  # - REDIS_URL uses service name "redis" as the hostname.
  # - Port 3000 is exposed to the host for direct API access and CI health checks.
  # - Healthcheck calls the /health endpoint which tests both DB and Redis.
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    networks:
      - taskflow-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend – React SPA served by Nginx (port 80 → host 8080)
  # - Waits for the backend to be healthy before starting.
  # - Nginx proxies /api/ → http://backend:3000/api/
  #              /health → http://backend:3000/health
  #              /       → index.html (SPA fallback)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - taskflow-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Custom bridge network – all services communicate through this network.
# ---------------------------------------------------------------------------
networks:
  taskflow-net:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volume – PostgreSQL data persists even when the container is removed.
# ---------------------------------------------------------------------------
volumes:
  pgdata:
