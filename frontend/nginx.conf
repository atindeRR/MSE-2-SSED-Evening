server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server. Using a variable in proxy_pass makes Nginx
  # re-resolve the "backend" service name at request time (cached 10s), so a
  # restarted/recreated backend container with a new IP is found again,
  # and Nginx does not fail to start if the backend is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:3000;

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass $backend_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
